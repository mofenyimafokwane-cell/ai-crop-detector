<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Detector</title>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

    <!-- Teachable Machine Image Library -->
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f8f2;
            padding: 30px;
        }

        h1 {
            color: #2e7d32;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #imagePreview {
            max-width: 300px;
            max-height: 300px;
            margin: 20px;
            border-radius: 15px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🌱 AI Crop Detector</h1>

    <p>Upload a crop image to check its health.</p>

    <input type="file" id="imageUpload" accept="image/*">

    <br>

    <img id="imagePreview" style="display:none;">

    <br>

    <button onclick="analyzeImage()">Analyze Crop</button>

    <div id="result">Waiting for image...</div>

    <script>
        // Your Teachable Machine model
        const URL = "https://teachablemachine.withgoogle.com/models/x3L-4To3E/";

        let model;

        // Load the AI model
        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            console.log("AI model loaded!");
        }

        // Show selected image
        document.getElementById("imageUpload").addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (file) {
                const image = document.getElementById("imagePreview");

                image.src = URL.createObjectURL(file);
                image.style.display = "block";
            }
        });

        // Analyze the image
        async function analyzeImage() {

            if (!model) {
                document.getElementById("result").innerText =
                    "AI model is still loading. Please wait...";
                return;
            }

            const image = document.getElementById("imagePreview");

            if (!image.src) {
                document.getElementById("result").innerText =
                    "Please choose an image first.";
                return;
            }

            const predictions = await model.predict(image);

            // Find the prediction with the highest confidence
            let highestPrediction = predictions[0];

            for (let i = 1; i < predictions.length; i++) {
                if (predictions[i].probability >
                    highestPrediction.probability) {

                    highestPrediction = predictions[i];
                }
            }

            const className = highestPrediction.className;
            const confidence = highestPrediction.probability * 100;

            document.getElementById("result").innerHTML =
                "🌱 Result: " + className +
                "<br>Confidence: " + confidence.toFixed(1) + "%";
        }

        // Start loading the model
        loadModel();
    </script>

</body>
<script src="script.js"></script>
</html>
